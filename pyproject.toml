[project]
name = "android-game-automator"
version = "0.1.0"
description = "Reusable Android game automation SDK foundation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adbutils-async>=0.0.6",
    "numpy>=2.0.0",
    "Pillow>=11.0.0",
    "rapidocr-onnxruntime>=1.4.4",
]

[project.scripts]
android-game-automator = "android_game_automator.cli:main"
botto = "botto.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["android_game_automator", "botto", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["android_game_automator", "botto"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
